    <main id="main-content">

        <section class="page-heading">

            <div class="container">

                <h1>Contact Me</h1>

                <p>
                    Feel free to send me a message.
                </p>

            </div>

        </section>

        <section class="section">

            <div class="container narrow">

                <h2>Contact Form</h2>

                <form class="contact-form"
                      action="#"
                      method="post"
                      aria-describedby="form-help">

                    <p id="form-help">
                        Fields marked with * are required.
                    </p>

                    <div class="form-group">

                        <label for="name">
                            Full Name *
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="email">
                            Email Address *
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                        >

                    </div>

                    <div class="form-group">

                        <label for="message">
                            Message *
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="7"
                            required>
                        </textarea>

                    </div>

                    <button type="submit" class="button">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>
